name: Publish client testing preview

on:
  push:
    tags:
      - 'preview-*'

concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test Image-to-CSV against a local mock API
        run: python3 -B examples/python/image_to_csv/tests/test_client.py
      - name: Test integration engine and HTTP transport
        run: python3 -B -m unittest discover -s examples/home_assistant/tests -v
      - name: Build source packages and publish a prerelease
        run: python3 -B tools/publish_preview.py --output-dir "$RUNNER_TEMP/watermeter-preview" --publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
